      - "pkg/client SDK, OTel optional, testcontainers e2e"
      - "Agent SIZE_SOURCE=database|relations"
  - version: "0.3.0"
    date: "2026-08-10"
    changes:
      - "Rename period_id → bucket_id (schema, API, package internal/bucket)"
