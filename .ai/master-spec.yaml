# ==============================================================================
# META
# ==============================================================================
agent_name: "Shardman_ControlPlane_Agent"
version: "0.2.0"
target_repository: "git@github.com:tormoz70/shardman.git"
last_updated: "2026-08-07"
purpose: >
  Помощь в разработке shardman — Go control plane для range-шардирования PostgreSQL.
  Инварианты: immutable bootstrap, volume subshards, time retention ring,
  max_future_periods, error shard, resolve API, seal/retention supervisors.

related_context:
  - "docs/master-spec.md"
  - "docs/mvp-plan.md"
  - "docs/sharding-model.md"
  - "docs/architecture.md"
  - ".cursor/rules/master-spec.mdc"

# ==============================================================================
# 1. PERSONA
# ==============================================================================
persona: >
  Ведущий Go backend engineer. Сохранять инварианты period/FSM/retention/error-shard.
  Изменение API — обновить `.ai/master-spec.yaml` и `docs/master-spec.md`.

# ==============================================================================
# 2. DOMAIN
# ==============================================================================
domain_knowledge:
  stack:
    - "Go 1.22+"
    - "HTTP: chi (/v1/...)"
    - "Metadata: PostgreSQL (pgx/v5), migrations/"
    - "cmd/server, cmd/agent, cmd/shardman"
    - "Prometheus /metrics, slog"
    - "deploy/docker-compose.yml"
    - "GitHub: SSH only"

  layout:
    - "internal/period — period_id, ClassifyWrite, retention"
    - "internal/fsm — standby/active/sealed/cleaning, data/error roles"
    - "internal/store — metadata repository"
    - "internal/resolve — write/read routing"
    - "internal/seal — volume supervisor"
    - "internal/retention — time eviction supervisor"
    - "internal/api — HTTP handlers"
    - "internal/metrics — Prometheus"

  sharding:
    mode: "range"
    volume_subshards: "standby→active→sealed per period_id; one active per period"
    time_retention:
      min_shards: "retention_depth + 1 + max_future_periods + 1(error)"
      eviction: "all data subshards of period → cleaning → agent truncate → standby"
      wall_clock: "retention anchored to wall-clock, not max written period"
    max_future_periods:
      zero: "future timestamps → error shard (not normal periods)"
      positive: "allow writes up to current+N future periods"
    error_shard:
      count: 1
      role: "error"
      routes: "too-future, evicted past, invalid key"
      no_retention_clean: true
    numeric_mvp: "volume subshards only; no retention/error required"

  guardrails:
    - "Bootstrap immutable; second bootstrap → 409"
    - "Hot-add data shards only as standby"
    - "Only one error shard"
    - "No SQL proxy in MVP"
    - "CLUSTER_KEY on admin/internal"
    - "No rebalance / period_spec change"

# ==============================================================================
# 3. CODE ANCHORS
# ==============================================================================
code_anchors:
  period: "internal/period/period.go"
  routing: "internal/period/routing.go"
  fsm: "internal/fsm/fsm.go"
  store: "internal/store/store.go"
  resolve: "internal/resolve/resolve.go"
  api: "internal/api/server.go"
  seal: "internal/seal/seal.go"
  retention: "internal/retention/retention.go"
  server: "cmd/server/main.go"
  agent: "cmd/agent/main.go"
  cli: "cmd/shardman/main.go"
  migrations: "migrations/001_init.sql"

# ==============================================================================
# 4. VERIFICATION
# ==============================================================================
verification:
  unit: "go test ./internal/period/... ./internal/fsm/..."
  integration: "METADATA_PG_DSN=... go test -tags=integration ./internal/store/..."
  compose: "make docker-up"

changelog:
  - version: "0.2.0"
    date: "2026-08-07"
    changes:
      - "Go MVP implemented"
      - "Time retention ring, max_future_periods, error shard"
  - version: "0.1.0"
    date: "2026-08-06"
    changes:
      - "Initial spec (Rust planned, superseded by Go)"
