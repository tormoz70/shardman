      - "Hash string shard_key lowercased before xxhash64"
      - "Time numeric shard_key: ms/sec threshold fixed (year-3000 boundary)"
      - "PatchState FOR UPDATE + version check; topology_version bump in same tx as shard mutations"
  - version: "0.4.0"
    date: "2026-08-11"
    changes:
