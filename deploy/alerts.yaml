groups:
  - name: shardman
    rules:
      - alert: ShardmanAgentStale
        expr: shardman_agent_last_seen_seconds > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Shardman agent {{ $labels.shard_uuid }} stale"
      - alert: ShardmanStandbyExhausted
        expr: shardman_standby_pool_size == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Shardman standby pool empty"
      - alert: ShardmanHeartbeatFailover
        expr: increase(shardman_heartbeat_failover_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Shardman auto-failover on stale heartbeat (bucket {{ $labels.bucket_id }})"
      - alert: ShardmanStaleActiveShards
        expr: shardman_stale_active_shards > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Shardman has stale active shards awaiting failover"
      - alert: ShardmanErrorRouteSpike
        expr: rate(shardman_error_route_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error-shard routing rate"
