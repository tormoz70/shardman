services:
  metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shardman
      POSTGRES_PASSWORD: shardman
      POSTGRES_DB: shardman_meta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shardman"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      METADATA_PG_DSN: postgres://shardman:shardman@metadata:5432/shardman_meta?sslmode=disable
      METADATA_PG_MAX_CONNS: "20"
      GRPC_ADDR: ":9091"
      HTTP_ADDR: ":8080"
      CLUSTER_KEY: dev-cluster-key
      SEAL_CHECK_INTERVAL: 10s
      HEARTBEAT_TIMEOUT: 60s
      HEALTH_CHECK_INTERVAL: 15s
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      metadata:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Optional: docker compose --profile tracing up
  #   OTEL_EXPORTER_OTLP_ENDPOINT=tempo:4317 docker compose --profile tracing up
  tempo:
    image: grafana/tempo:2.6.1
    profiles: [tracing]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317"
